apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 10
  selector:
    matchLabels:
      app: mi-api
  template:
    metadata:
      labels:
        app: mi-api
    spec:
      containers:
      - name: mi-api
        # IMPORTANTE: Poner su usuario de GitHub todo en minúsculas
        image: ghcr.io/leonfc-cloud/mi-api:latest
        imagePullPolicy: Always # Siempre busca la versión más nueva en ghcr.io
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  selector:
    app: mi-api
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30080
